spring:
  datasource:
    url: jdbc:mysql://api.prism-sfa-dev.net:3306/sfa_db
    username: PrismSfa
    password: TestUser123!
    hikari:
      connection-timeout: 60000          # 1 minute
      max-lifetime: 1800000              # 30 minutes
      idle-timeout: 300000               # 5 minutes
      maximum-pool-size: 10              # Adjust based on application needs

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  spring:
    security:
      enabled: false

  application:
    name: order-service

server:
  port: 9092
  servlet:
    context-path: /order-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

validate:
  token:
    url: http://localhost:9094/auth-service/auth/validateToken?token=
application:
  config:
    trace: true
product:
  getProduct:
    url: http://localhost:9093/product-service/products/
products:
  service:
    url: http://localhost:9093/product-service

clients:
  service:
    url: http://localhost:8080/client-fmcg/getClientFMCGById
  updateClient:
    url: http://localhost:8080/client-fmcg/updateClientFMCGById

members:
  memberIds:
    url: http://localhost:8080/getAllMemberIdsByReportingManager
  service:
    url: http://localhost:8080/getMemberById

outlets:
  getAllOutlet:
    url: http://localhost:8080/getAllOutletByIds
  getOutlet:
    url: http://localhost:8080/getOutletById

beets:
  getAllBeets:
    url: http://localhost:8080/getAllBeetByIds
  getBeet:
    url: http://localhost:8080/getBeetById


  # CORS Configuration
  spring:
    mvc:
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST,PUT,DELETE
        allowed-headers: "*"
        allow-credentials: true
