spring:
  profiles:
    active: dev
  datasource:
    username: ${DB_USERNAME}
    url: ${DB_URL}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 60000          # 1 minute
      max-lifetime: 1800000              # 30 minutes
      idle-timeout: 300000               # 5 minutes
      maximum-pool-size: 20           # Adjust based on application needs

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  spring:
    security:
      enabled: false

  application:
    name: order-service

server:
  port: 9092
  servlet:
    context-path: /order-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

validate:
  token:
    url: http://localhost:9094/auth-service/auth/validateToken?token=
application:
  config:
    trace: true
product:
  getProduct:
    url: http://localhost:9093/product-service/products/
doctor:
  getDoctor:
    url: http://localhost:9090/doctors
products:
  getAllProductByIds:
    url: http://localhost:9093/product-service/products/getAllProductByIds
  service:
    url: http://localhost:9093/product-service

clients:
  service:
    url: http://localhost:9090/client-fmcg/getClientFMCGById
  updateClient:
    url: http://localhost:9090/client-fmcg/updateClientFMCGById

members:
  memberIds:
    url: http://localhost:9090/getAllMemberIdsByReportingManager
  service:
    url: http://localhost:9090/getMemberById

outlets:
  getAllOutlet:
    url: http://localhost:9090/getAllOutletByIds
  getOutlet:
    url: http://localhost:9090/getOutletById
  getOutForReport:
    url: http://localhost:9090/getOutletForReportById

combineTourPlan:
  updateBjpAndCjpOrderValue:
    url: http://localhost:9090/combine-tour-plan/updateBjpAndCjpOrderValue

beets:
  getAllBeets:
    url: http://localhost:9090/getAllBeetByIds
  getBeet:
    url: http://localhost:9090/getBeetById
  getBeetForReport:
    url: http://localhost:9090/getBeetByIdForReport

sampleInventory:
  getInventory:
    url: http://localhost:9095/inventory-service/sample-inventory/getInventoryByMemberAndProductId
  deduct:
    url: http://localhost:9095/inventory-service/sample-inventory/updateSampleInventoryQuantity
  customUpdate:
    url: http://localhost:9095/inventory-service/sample-inventory/updateCustomInventory

inventory:
  update:
    url: http://localhost:9095/inventory-service/inventory/sync/update
  customUpdate:
    url: http://localhost:9095/inventory-service/inventory/updateCustomInventory

name:
  state:
    url: http://localhost:9090/states/getStateNameById
  city:
    url: http://localhost:9090/getCityNameById
  region:
    url: http://localhost:9090/getRegionNameById

  # CORS Configuration
  spring:
    mvc:
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST,PUT,DELETE
        allowed-headers: "*"
        allow-credentials: true
