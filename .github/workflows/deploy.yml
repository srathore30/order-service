name: Deploy Order Service

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print working directory and list files
        run: |
          echo "Root Directory:"
          pwd  # Print current working directory
          ls -la  # List all files and directories at the root level

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Order Service
        run: |
          mvn clean package -DskipTests  # Build the Maven project

      - name: List built artifacts
        run: ls -la target/  # Verify the target directory contains the JAR file

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v3
        with:
          name: jar-file
          path: target/*.jar
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: jar-file

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "*.jar"
          target: "~/sfa-service/order-service/"


      - name: Run Deployment Script on VPS
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: "bash ~/sfa-service/order-service/orderStartUp.sh"
