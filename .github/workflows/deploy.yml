name: Debug Directory Structure

on:
  push:
    branches:
      - dev

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print root directory structure
        run: |
          echo "Root Directory:"
          pwd  # Print current working directory
          ls -la  # List all files and directories at the root level

      - name: Check sfa-service directory
        run: |
          if [ -d "sfa-service" ]; then
            echo "sfa-service directory exists. Listing contents:"
            ls -la sfa-service
          else
            echo "sfa-service directory does not exist."
          fi

      - name: Check order-service directory
        run: |
          if [ -d "sfa-service/order-service" ]; then
            echo "order-service directory exists. Listing contents:"
            ls -la sfa-service/order-service
          else
            echo "order-service directory does not exist. Checking other possibilities:"
            find . -type d -name "order-service" || echo "No order-service directory found."
          fi
