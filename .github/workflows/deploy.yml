name: Deploy Order Service

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Order Service
        run: |
          mvn clean install

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v3
        with:
          name: jar-file
          path: target/*.jar
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: jar-file

      - name: Copy JAR to VPS using SCP with Password
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}  # Use password for authentication
          source: "*.jar"
          target: "~/sfa-service/order-service/"
          debug: true

      - name: Run Deployment Script on VPS with Increased Timeout
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}  # Use password for SSH access
          script: |
            # Stop any existing process using the old JAR
            pkill -f 'java -jar' || echo "No running Java process to terminate."
            echo "Running JAR: $(ls -l ~/sfa-service/order-service/order-0.0.1-SNAPSHOT.jar)"
            nohup java -jar ~/sfa-service/order-service/order-0.0.1-SNAPSHOT.jar > ~/sfa-service/order-service/nohup.out 2>&1 &
            echo "New JAR started."
            # Optional: Tail the nohup output to see logs live
            tail -f ~/sfa-service/order-service/nohup.out
          port: 22
          timeout: 1h  # Increased timeout to 1 hour
          command_timeout: 30m  # Increased command timeout to 30 minutes
          debug: true
