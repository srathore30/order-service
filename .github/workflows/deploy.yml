name: Deploy to VPS

on:
  push:
    branches:
      - dev
    schedules:
      - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      USERNAME: ${{ secrets.USERNAME }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print working directory
        run: |
          pwd
          ls -la  # Verify files in the root directory

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Order Service
        run: |
          cd sfa-service/order-service  # Navigate to order-service directory
          ./gradlew build               # Build the project

      - name: List built artifacts
        run: ls -la sfa-service/order-service/build/libs/

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v3
        with:
          name: jar-file
          path: sfa-service/order-service/build/libs/*.jar
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: jar-file

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "*.jar"
          target: "~/sfa-service/order-service/"

      - name: Run Deployment Script on VPS
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: "bash ~/sfa-service/order-service/orderStartUp.sh"
